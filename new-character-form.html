<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a Ghibli Spirit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">GhibliSpirits</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="details.html">Details</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link active" href="new-character-form.html">Add a Character</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 shadow-sm border-0">
          <h2 class="mb-3 text-center">Add a New Character to the Gallery</h2>
          <p class="text-center text-muted small mb-4">Submit another character to the gallery.</p>
          <form onsubmit="event.preventDefault(); alert('Spirit submitted! (Frontend demo only)');">
            <div class="mb-3">
              <label class="form-label">Character / Spirit Name</label>
              <input type="text" class="form-control" required placeholder="e.g., Kodama (Tree Spirits)">
            </div>
            <div class="mb-3">
              <label class="form-label">Universe / Movie Title</label>
              <input type="text" class="form-control" required placeholder="e.g., Princess Mononoke">
            </div>
            <div class="mb-3">
              <label class="form-label">Role in Story</label>
              <input type="text" class="form-control" required placeholder="e.g., Sign of a healthy forest">
            </div>
            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input type="url" class="form-control" required placeholder="https://example.com/image.jpg">
            </div>
            <div class="mb-3">
              <label class="form-label">Short Description</label>
              <textarea class="form-control" rows="3" required placeholder="Describe their appearance and mystical habits..."></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Submit Spirit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
